# Release builds: static binaries for Linux, macOS and Windows, an SBOM for
# every archive, and a Sigstore signature over the checksums file.
version: 2
project_name: hejnal

builds:
  - id: hejnal
    main: ./cmd/hejnal
    binary: hejnal
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Legatia/hejnal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

nfpms:
  # Debian/Ubuntu, Fedora/RHEL and Alpine packages with a daily systemd timer.
  - id: packages
    package_name: hejnal
    ids: [hejnal]
    vendor: Legatia Solutions
    homepage: https://hejnal.legatia.solutions
    maintainer: Legatia Solutions <hejnal@legatia.solutions>
    description: Early warning when attackers start exploiting software you run.
    license: Apache-2.0
    section: net
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    contents:
      - src: packaging/hejnal.service
        dst: /usr/lib/systemd/system/hejnal.service
      - src: packaging/hejnal.timer
        dst: /usr/lib/systemd/system/hejnal.timer
      - src: packaging/hejnal.env
        dst: /etc/hejnal/hejnal.env
        type: config|noreplace
        file_info:
          mode: 0600
      - src: examples/scope.example.json
        dst: /usr/share/doc/hejnal/scope.example.json
      - src: LICENSE
        dst: /usr/share/doc/hejnal/LICENSE
      - src: README.md
        dst: /usr/share/doc/hejnal/README.md

kos:
  # A small container image with only the binary, for linux/amd64 and arm64.
  - id: image
    build: hejnal
    main: ./cmd/hejnal
    base_image: gcr.io/distroless/static-debian12:nonroot
    repositories: [ghcr.io/legatia/hejnal]
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Version }}", latest]
    bare: true
    preserve_import_paths: false
    sbom: spdx
    ldflags:
      - -s -w -X github.com/Legatia/hejnal/version.Version={{ .Version }}
    labels:
      org.opencontainers.image.source: https://github.com/Legatia/hejnal
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.description: Early warning when attackers start exploiting software you run.

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  # GitHub's own release notes: one line per merged pull request, by its
  # title, instead of every commit including merges.
  use: github-native

release:
  # Releases start as drafts so a person checks them before publishing.
  draft: true

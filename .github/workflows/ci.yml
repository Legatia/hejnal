name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: go test -race ./...

  # Feeds each parser of untrusted input (answers from scanned systems,
  # downloaded catalogs, scope files) random data for a short while. A
  # crash fails the job and leaves the input that caused it under
  # testdata/fuzz, uploaded as an artifact, to add as a regression test.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz
        run: |
          set -e
          for target in \
            "fingerprint FuzzIdentify" "fingerprint FuzzBanner" \
            "kev FuzzParse" "euvd FuzzParse" "euvd FuzzParseRecord" \
            "nvd FuzzParseAndCheck" "nvd FuzzParseVersion" \
            "scope FuzzParse" "leaks FuzzScanReader" \
            "deps FuzzParse" "iac FuzzHCL" "iac FuzzYAML"; do
            set -- $target
            echo "== $1 $2"
            # Go's fuzzer now and then fails as the time runs out with
            # "context deadline exceeded" and no failing input. That says
            # nothing about the code, so such a run gets one more try.
            for attempt in 1 2; do
              status=0
              go test -run='^$' -fuzz="^$2\$" -fuzztime=20s "./$1/" > fuzz.log 2>&1 || status=$?
              cat fuzz.log
              if [ "$status" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -eq 2 ] || grep -q 'Failing input written' fuzz.log || ! grep -q 'context deadline exceeded' fuzz.log; then
                exit "$status"
              fi
              echo "== $1 $2: the fuzzer timed out without a failing input; trying once more"
            done
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # Releases are built for these systems from Linux, so check that the
      # code, including tests and platform-specific files, compiles for them.
      - name: go vet for macOS and Windows
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      - name: Fingerprint rules are valid JSON
        run: python3 -m json.tool fingerprint/rules.json > /dev/null
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        run: go build -trimpath -o /dev/null ./cmd/hejnal
      # The fixtures under testdata are vulnerable on purpose.
      - name: Hejnal scans its own code
        run: go run ./cmd/hejnal code scan -exclude testdata -state "$RUNNER_TEMP/hejnal-state" .

  # Runs the action from this checkout with the latest release, the way a
  # user's workflow does, so a mistake in action.yml shows up here.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        uses: ./
        with:
          version: 0.7.0
          # The fixtures under testdata are vulnerable on purpose.
          exclude: testdata
      - name: The SARIF file is valid JSON
        env:
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: python3 -m json.tool "$SARIF" > /dev/null

  # Builds the release locally, without publishing or signing, so a broken
  # release config shows up here rather than when a tag is pushed.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom,ko
      - name: Packages contain the binary and the systemd timer
        run: |
          deb="$(ls dist/*_linux_amd64.deb)"
          dpkg-deb -c "$deb" | tee contents.txt
          for f in ./usr/bin/hejnal ./usr/lib/systemd/system/hejnal.service ./usr/lib/systemd/system/hejnal.timer ./etc/hejnal/hejnal.env; do
            grep -q " $f$" contents.txt || { echo "missing $f"; exit 1; }
          done
          ls dist/*.rpm dist/*.apk

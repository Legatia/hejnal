# Tests on a real Mac. GitHub's hosted macOS runners are sometimes not
# available for a while, which would leave pull requests waiting, so this
# runs after merges to main, once a week and on request instead of on every
# pull request. The ci workflow checks on each pull request that the code
# compiles for macOS.
name: macos

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: go test -race ./...

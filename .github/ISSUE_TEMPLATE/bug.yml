name: Bug
description: Hejnal failed, crashed or did something its documentation says it does not do.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave out your scope file, host names, tokens, webhook addresses and anything else private. A vulnerability in Hejnal itself goes to [private reporting](https://github.com/Legatia/hejnal/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The command and the relevant part of its output, with private names removed.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `hejnal version`.
      placeholder: hejnal 0.6.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - Release archive
        - Linux package (.deb, .rpm or .apk)
        - Container image
        - go install
        - Built from source
        - GitHub Action
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 26, Windows 11
